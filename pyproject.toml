[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-room"
version = "0.1.0"
description = "A classroom where a local LLM (≤27B) learns 12 grades of subjects without gradient training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
ai-room = "ai_room.cli:main"

[tool.setuptools.packages.find]
include = ["ai_room*"]

[tool.setuptools.package-data]
ai_room = ["web/*"]
