[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-room"
version = "0.2.0"
description = "A classroom where a ≤27B model learns 12 classes in 100 subjects without training — taught by textbooks and exact generators, not by another AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
pdf = ["pypdf"]
dev = ["pytest>=8"]

[project.scripts]
ai-room = "ai_room.cli:main"

[tool.setuptools.packages.find]
include = ["ai_room*"]

[tool.setuptools.package-data]
ai_room = ["web/*"]
