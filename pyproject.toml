[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-room"
version = "0.3.0"
description = "A classroom where a ≤27B model learns 12 classes in 100 subjects without training — plus a Workshop of 1,200+ tools (Blender, video, images, Colab, Kaggle, YouTube…)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
pdf = ["pypdf"]
train = ["torch", "transformers>=4.45", "peft>=0.12", "accelerate"]   # CPU build of torch: pip install torch --index-url https://download.pytorch.org/whl/cpu
media = ["pillow", "pypdf"]   # images, 3D previews and GIFs; install ffmpeg separately for video/audio
dev = ["pytest>=8"]

[project.scripts]
ai-room = "ai_room.cli:main"

[tool.setuptools.packages.find]
include = ["ai_room*"]

[tool.setuptools.package-data]
ai_room = ["web/*"]
