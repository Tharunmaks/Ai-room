<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>AI Room — a classroom where AI learns without training</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237f9bff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/workshop.css">
  <script>try { var t = localStorage.getItem("ar.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main navigation">
    <div class="logo"><div class="mark">🎓</div><span class="t">AI Room<small>learning without training</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="foot"><nav class="nav"><button id="themeBtn" aria-label="Toggle light or dark theme"></button></nav></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Classroom</h1>
      <div class="picker-room" id="roomPicker" hidden><select id="roomSelect" aria-label="Choose classroom"></select></div>
      <div class="grow"></div>
      <button class="btn primary" id="newBtn"></button>
    </header>
    <main class="page" id="page" tabindex="-1"><div class="skeleton" style="height:240px"></div></main>
  </div>
</div>
<dialog class="modal" id="modal"></dialog>
<div id="drawerHost"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script src="/static/core.js"></script>
<script src="/static/components.js"></script>
<script src="/static/app.js"></script>
<script src="/static/workshop.js"></script>
</body>
</html>
